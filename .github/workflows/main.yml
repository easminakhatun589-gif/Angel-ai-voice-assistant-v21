name: Build ANGEL AI APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: step-security/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make Gradlew Executable
        run: |
          chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Environment Diagnostics
        run: |
          echo "--- Java Version ---"
          java -version
          echo "--- Android SDK Path ---"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "--- Gradle Daemon Status ---"
          ./gradlew --status

      - name: Prepare Build Credentials & Config
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app

          # 1. Search for any existing google-services.json in the repository and ensure it's in app/
          if [ ! -f "app/google-services.json" ]; then
            FOUND_FILE=$(find . -name "google-services.json" -not -path "*/build/*" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              echo "Found $FOUND_FILE in repository, copying to app/google-services.json"
              cp "$FOUND_FILE" app/google-services.json
            fi
          fi

          # 2. If not found in repository, restore from GitHub Secret GOOGLE_SERVICES_JSON
          if [ ! -f "app/google-services.json" ] && [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Restoring app/google-services.json from GitHub Actions secret GOOGLE_SERVICES_JSON..."
            if echo "$GOOGLE_SERVICES_JSON_SECRET" | grep -q "^{"; then
              echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            fi
            echo "Successfully created app/google-services.json from secret."
          fi

          # 3. Ensure debug.keystore is ready
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          fi

          # 4. Final verification
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing!"
            echo "::error::Please add a repository secret named GOOGLE_SERVICES_JSON with the contents of your google-services.json file."
            exit 1
          fi
          echo "Verified app/google-services.json is present and ready for build."

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          echo "Building Debug APK..."
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Archive Build Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostics
          path: |
            build/
            app/build/
            **/build/reports/
            ~/.gradle/daemon/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Release APK (Optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.JARVIS_RELEASE_CERT_SHA256 }}
          DEVELOPER_NAME: ${{ secrets.JARVIS_DEVELOPER_NAME }}
          COPYRIGHT_OWNER: ${{ secrets.JARVIS_COPYRIGHT_OWNER }}
          VERIFICATION_ENDPOINT: ${{ secrets.JARVIS_VERIFICATION_ENDPOINT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HIVE_API_KEY: ${{ secrets.HIVE_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing credentials detected. Building Release APK..."
            KEYSTORE_FILE=$(mktemp /tmp/release-keystore.XXXXXX.jks)
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            
            export JARVIS_RELEASE_STORE_FILE="$KEYSTORE_FILE"
            export JARVIS_RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export JARVIS_RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export JARVIS_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            export JARVIS_RELEASE_CERT_SHA256="$RELEASE_CERT_SHA256"
            export JARVIS_DEVELOPER_NAME="$DEVELOPER_NAME"
            export JARVIS_COPYRIGHT_OWNER="$COPYRIGHT_OWNER"
            export JARVIS_VERIFICATION_ENDPOINT="$VERIFICATION_ENDPOINT"
            
            ./gradlew assembleRelease --no-daemon --stacktrace
            
            rm -f "$KEYSTORE_FILE"
            echo "Release APK build finished successfully."
          else
            echo "Release signing secrets not configured. Skipping release build."
          fi

      - name: Verify APK Outputs
        id: verify_apk
        run: |
          FOUND_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)
          if [ "$FOUND_COUNT" -eq 0 ]; then
            echo "::error::No APK files were found under app/build/outputs/apk!"
            exit 1
          fi
          echo "Verified $FOUND_COUNT APK file(s):"
          find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} +

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish Build Summary
        if: always()
        run: |
          echo "## 🤖 ANGEL AI — Automatic APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit Hash** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Status** | ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/outputs/apk" ]; then
            echo "### 📦 Generated APK Files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} + >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 **How to download your APK**: In GitHub, open the **Actions** tab, click this workflow run, scroll down to the **Artifacts** section at the bottom, and click **ANGEL-AI-APK**." >> $GITHUB_STEP_SUMMARY
          fi
